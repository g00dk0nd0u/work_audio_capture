[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teams-audio-spike"
version = "0.1.0"
description = "Minimal concurrent WASAPI loopback and microphone recorder"
requires-python = ">=3.10"
dependencies = ["PyAudioWPatch==0.2.12.7"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
audio-capture-spike = "audio_capture.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
