[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "work-audio-capture"
version = "0.1.0"
description = "Minimal concurrent WASAPI loopback and microphone recorder"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
pyaudio = ["PyAudioWPatch==0.2.12.8"]

[project.scripts]
work-audio-capture = "audio_capture.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
