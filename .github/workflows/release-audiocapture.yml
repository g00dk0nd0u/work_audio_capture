name: Release AudioCapture

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-audiocapture.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (for example v0.1.1)"
        required: true
        default: "v0.1.0"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Package AudioCapture
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version || 'v0.1.0' }}"
          ASSET="AudioCapture-${VERSION}.zip"
          test -d AudioCapture
          zip -r "${ASSET}" AudioCapture
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "ASSET=${ASSET}" >> "${GITHUB_ENV}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "Release ${VERSION} already exists; refusing to overwrite it." >&2
            exit 1
          fi
          gh release create "${VERSION}" "${ASSET}" \
            --target "${GITHUB_SHA}" \
            --title "AudioCapture ${VERSION}" \
            --notes "Windows audio capture distribution. Download \`${ASSET}\`, extract it, and run \`python record_one_click.py\`."
