name: Release AudioCapture

on:
  push:
    branches: [main]
    paths:
      - ".audiocapture-version"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (for example v0.1.2)"
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="$(tr -d '\r\n' < .audiocapture-version)"
          fi
          case "${VERSION}" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "Invalid release version: ${VERSION}" >&2
              exit 1
              ;;
          esac
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "ASSET=AudioCapture-${VERSION}.zip" >> "${GITHUB_ENV}"

      - name: Package AudioCapture
        shell: bash
        run: |
          set -euo pipefail
          test -d AudioCapture
          zip -r "${ASSET}" AudioCapture

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "Release ${VERSION} already exists; refusing to overwrite it." >&2
            exit 1
          fi
          gh release create "${VERSION}" "${ASSET}" \
            --target "${GITHUB_SHA}" \
            --title "AudioCapture ${VERSION}" \
            --notes "Windows audio capture distribution. Download \`${ASSET}\`, extract the ZIP completely, then run \`record_one_click.py\` from the extracted AudioCapture folder."
