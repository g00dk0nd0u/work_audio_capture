name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hardware-independent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependency only
        run: python -m pip install pytest
      - name: Unit tests
        run: PYTHONPATH=src python -m pytest
      - name: Source-direct entry point
        run: python run.py --help
      - name: Syntax check
        run: python -m compileall -q run.py src tests
      - name: Whitespace check
        run: git diff --check

  windows-dependency-smoke:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned native dependency
        run: python -m pip install PyAudioWPatch==0.2.12.8
      - name: Import and report runtime metadata
        shell: python
        run: |
          import importlib.metadata
          import platform
          import pyaudiowpatch
          print("PyAudioWPatch:", importlib.metadata.version("PyAudioWPatch"))
          print("Python:", platform.python_version())
          print("Architecture:", platform.architecture()[0], platform.machine())
          print("Platform:", platform.platform())
          print("Import:", pyaudiowpatch.__name__, "OK")
