name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  hardware-independent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install pytest
      - run: PYTHONPATH=src python -m pytest
      - run: python run.py --help
      - name: Compile repository and distribution Python
        run: python -m compileall -q run.py record_one_click.py src tests distribution_audio_capture
      - name: Verify distribution ZIP matches distribution directory
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile

          dist = Path("distribution_audio_capture")
          archive = Path("distribution_audio_capture.zip")

          def is_distribution_file(path: Path) -> bool:
              return (
                  path.is_file()
                  and "__pycache__" not in path.parts
                  and path.suffix != ".pyc"
              )

          expected = {
              path.relative_to(dist).as_posix(): path.read_bytes()
              for path in dist.rglob("*")
              if is_distribution_file(path)
          }

          actual = {}
          unexpected_roots = []
          duplicates = []
          with ZipFile(archive) as zf:
              for info in zf.infolist():
                  if info.is_dir():
                      continue
                  member = PurePosixPath(info.filename)
                  if not member.parts or member.parts[0] != dist.name:
                      unexpected_roots.append(info.filename)
                      continue
                  relative = PurePosixPath(*member.parts[1:]).as_posix()
                  if relative in actual:
                      duplicates.append(info.filename)
                  actual[relative] = zf.read(info)

          missing = sorted(set(expected) - set(actual))
          extra = sorted(set(actual) - set(expected))
          changed = sorted(
              name for name in set(expected) & set(actual)
              if expected[name] != actual[name]
          )

          problems = []
          if unexpected_roots:
              problems.append(f"unexpected ZIP roots: {unexpected_roots}")
          if duplicates:
              problems.append(f"duplicate ZIP files: {duplicates}")
          if missing:
              problems.append(f"missing from ZIP: {missing}")
          if extra:
              problems.append(f"extra in ZIP: {extra}")
          if changed:
              problems.append(f"byte mismatch: {changed}")

          if problems:
              raise SystemExit(
                  "distribution_audio_capture.zip is stale or inconsistent:\n- "
                  + "\n- ".join(problems)
              )

          print(f"Distribution ZIP synchronized: {len(expected)} files")
          PY
      - run: git diff --check
  windows-native-smoke:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python-version }}"}
      - run: python -m pip install pytest
      - name: Full test suite (native bindings and Media Foundation included)
        shell: bash
        run: PYTHONPATH=src python -m pytest
      - name: Source and distribution entry-point imports
        shell: bash
        run: |
          python -c "import runpy; runpy.run_path('run.py'); runpy.run_path('record_one_click.py')"
          python -c "import runpy; runpy.run_path('distribution_audio_capture/run.py'); runpy.run_path('distribution_audio_capture/record_one_click.py')"
      - name: Compile one-click and distribution Python
        run: python -m compileall -q run.py record_one_click.py src tests distribution_audio_capture
      - name: COM and MMDevice smoke (endpoints are not required on hosted CI)
        shell: bash
        run: |
          PYTHONPATH=src python -c "from audio_capture.wasapi import ComApartment; from audio_capture.native_backend import NativeWasapiBackend; from audio_capture.media_foundation import Mp3Encoder; c=ComApartment(); c.__enter__(); c.__exit__(None,None,None); print('COM OK'); b=NativeWasapiBackend(); print(tuple(map(len,b.endpoints())))"
