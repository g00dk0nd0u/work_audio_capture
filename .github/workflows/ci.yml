name: CI
on: [push, pull_request]
permissions:
  contents: write
jobs:
  hardware-independent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install pytest
      - run: PYTHONPATH=src python -m pytest
      - run: python run.py --help
      - name: Compile repository and distribution Python
        run: python -m compileall -q run.py record_one_click.py src tests distribution_audio_capture
      - run: git diff --check
      - name: Rebuild tracked distribution ZIP
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile, ZipInfo

          root = Path('distribution_audio_capture')
          files = sorted(p for p in root.rglob('*') if p.is_file() and '__pycache__' not in p.parts)
          out = Path('distribution_audio_capture.zip')
          with ZipFile(out, 'w', compression=ZIP_DEFLATED, compresslevel=9) as zf:
              for path in files:
                  arcname = path.as_posix()
                  info = ZipInfo(arcname, date_time=(1980, 1, 1, 0, 0, 0))
                  info.compress_type = ZIP_DEFLATED
                  info.external_attr = 0o100644 << 16
                  zf.writestr(info, path.read_bytes(), compress_type=ZIP_DEFLATED, compresslevel=9)
          print(f'ZIP files: {len(files)}')
          assert len(files) == 12, [p.as_posix() for p in files]
          PY
          git diff --check
          if git diff --quiet -- distribution_audio_capture.zip; then
            echo "distribution_audio_capture.zip already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add distribution_audio_capture.zip
          git commit -m "Refresh distribution package zip"
          git push origin HEAD:codex
  windows-native-smoke:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python-version }}"}
      - run: python -m pip install pytest
      - name: Full test suite (native bindings and Media Foundation included)
        shell: bash
        run: PYTHONPATH=src python -m pytest
      - name: Source and distribution entry-point imports
        shell: bash
        run: |
          python -c "import runpy; runpy.run_path('run.py'); runpy.run_path('record_one_click.py')"
          python -c "import runpy; runpy.run_path('distribution_audio_capture/run.py'); runpy.run_path('distribution_audio_capture/record_one_click.py')"
      - name: Compile one-click and distribution Python
        run: python -m compileall -q run.py record_one_click.py src tests distribution_audio_capture
      - name: COM and MMDevice smoke (endpoints are not required on hosted CI)
        shell: bash
        run: |
          PYTHONPATH=src python -c "from audio_capture.wasapi import ComApartment; from audio_capture.native_backend import NativeWasapiBackend; from audio_capture.media_foundation import Mp3Encoder; c=ComApartment(); c.__enter__(); c.__exit__(None,None,None); print('COM OK'); b=NativeWasapiBackend(); print(tuple(map(len,b.endpoints())))"
