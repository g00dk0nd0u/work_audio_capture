name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  hardware-independent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install pytest
      - run: PYTHONPATH=src python -m pytest
      - run: python run.py --help
      - name: Compile repository and distribution Python
        run: python -m compileall -q run.py record_one_click.py src tests distribution_audio_capture
      - run: git diff --check
  windows-native-smoke:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python-version }}"}
      - run: python -m pip install pytest
      - name: Native binding import and deterministic tests
        shell: bash
        run: PYTHONPATH=src python -m pytest
      - name: Compile one-click and distribution Python
        run: python -m compileall -q run.py record_one_click.py src tests distribution_audio_capture
      - name: COM and MMDevice smoke (endpoints are not required on hosted CI)
        shell: bash
        run: |
          PYTHONPATH=src python -c "from audio_capture.wasapi import ComApartment; from audio_capture.native_backend import NativeWasapiBackend; c=ComApartment(); c.__enter__(); c.__exit__(None,None,None); print('COM OK'); b=NativeWasapiBackend(); print(tuple(map(len,b.endpoints())))"
