name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hardware-independent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependency only
        run: python -m pip install pytest
      - name: Unit tests
        run: PYTHONPATH=src python -m pytest
      - name: Source-direct entry point
        run: python run.py --help
      - name: Syntax check
        run: python -m compileall -q run.py src tests
      - name: Whitespace check
        run: git diff --check
