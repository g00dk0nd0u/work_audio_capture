name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  hardware-independent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install pytest
      - run: PYTHONPATH=src python -m pytest
      - run: python run.py --help
      - name: Compile repository and distribution Python
        run: python -m compileall -q run.py record_one_click.py src tests distribution_audio_capture
      - name: Verify distribution runtime mirrors source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          dist = Path("distribution_audio_capture")
          entry_points = {
              Path("record_one_click.py"): dist / "record_one_click.py",
          }
          problems = [
              f"{source} != {packaged}"
              for source, packaged in entry_points.items()
              if not packaged.is_file() or source.read_bytes() != packaged.read_bytes()
          ]

          source_dir = Path("src/audio_capture")
          packaged_dir = dist / source_dir
          source_files = {path.name: path for path in source_dir.glob("*.py")}
          packaged_files = {path.name: path for path in packaged_dir.glob("*.py")}

          missing = sorted(source_files.keys() - packaged_files.keys())
          extra = sorted(packaged_files.keys() - source_files.keys())
          mismatched = sorted(
              name for name in source_files.keys() & packaged_files.keys()
              if source_files[name].read_bytes() != packaged_files[name].read_bytes()
          )
          problems.extend(f"missing in distribution: {name}" for name in missing)
          problems.extend(f"extra/stale in distribution: {name}" for name in extra)
          problems.extend(f"byte mismatch: {name}" for name in mismatched)

          if problems:
              raise SystemExit(
                  "distribution runtime is stale or incomplete:\n- "
                  + "\n- ".join(problems)
              )

          print(
              "Distribution runtime synchronized: "
              f"{len(entry_points) + len(source_files)} files"
          )
          PY
      - run: git diff --check
  windows-native-smoke:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python-version }}"}
      - run: python -m pip install pytest
      - name: Full test suite (native bindings and Media Foundation included)
        shell: bash
        run: PYTHONPATH=src python -m pytest
      - name: Source and distribution entry-point imports
        shell: bash
        run: |
          python -c "import runpy; runpy.run_path('run.py'); runpy.run_path('record_one_click.py')"
          python -c "import runpy; runpy.run_path('distribution_audio_capture/record_one_click.py')"
      - name: Compile one-click and distribution Python
        run: python -m compileall -q run.py record_one_click.py src tests distribution_audio_capture
      - name: COM and MMDevice smoke (endpoints are not required on hosted CI)
        shell: bash
        run: |
          PYTHONPATH=src python -c "from audio_capture.wasapi import ComApartment; from audio_capture.native_backend import NativeWasapiBackend; from audio_capture.media_foundation import Mp3Encoder; c=ComApartment(); c.__enter__(); c.__exit__(None,None,None); print('COM OK'); b=NativeWasapiBackend(); print(tuple(map(len,b.endpoints())))"
